<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ccbf0" />
      <stop offset="0.7" stop-color="#dcecf8" />
      <stop offset="1" stop-color="#f6f3ea" />
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efdf" />
      <stop offset="1" stop-color="#e6d9bf" />
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd49a" />
      <stop offset="1" stop-color="#6fb273" />
